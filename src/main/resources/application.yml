spring:
  application:
    name: banking-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      FAIL_ON_NULL_FOR_PRIMITIVES: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

banking:
  jwt:
    secret: ${JWT_SECRET:Zm91ci1zZWN1cmUtZGVtby1qd3Qtc2VjcmV0LWtleS1mb3ItYmFua2luZy1zeXN0ZW0tMjAyNg==}
    access-token-minutes: 30
    refresh-token-days: 7
    issuer: banking-management-system
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  withdrawal:
    max-per-transaction: 100000
    max-daily: 250000
  seed:
    enabled: ${SEED_ENABLED:true}
  security:
    expose-reset-token: ${EXPOSE_RESET_TOKEN:true}

logging:
  level:
    com.banking: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:bankingdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

banking:
  seed:
    enabled: false
  security:
    expose-reset-token: true
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1iYW5raW5nLXN5c3RlbS11bml0LXRlc3RzLTIwMjYtMTIzNDU2Nzg5MA==
